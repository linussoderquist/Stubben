<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fjällstugan</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 2rem;
    }

    .viewer-wrapper {
      padding: 10px;
    }

    iframe {
      border: none;
      width: 800px;
      height: 500px;
      max-width: 100%;
    }

    #map {
      height: 450px;
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Fjällstugan</h1>

  <div class="viewer-wrapper">
    <iframe
      id="viewer"
      allow="fullscreen; xr-spatial-tracking"
      src="https://superspl.at/s?id=ae5c632b">
    </iframe>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const lat = 65.25766694931896;
    const lon = 15.71001019792998;

    const map = L.map('map').setView([lat, lon], 10);

    // Baslager
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // SLU markfuktighet (WMS)
    const soilMoisture = L.tileLayer.wms(
      "https://gis-prod.slu.se/arcgis/services/markfuktighet/MapServer/WMSServer",
      {
        layers: "0",
        format: "image/png",
        transparent: true,
        attribution: "SLU Markfuktighet"
      }
    );

    // Marker
    L.marker([lat, lon])
      .addTo(map)
      .bindPopup("Fjällstugan")
      .openPopup();

    // Lagerkontroll
    const baseMaps = {
      "OpenStreetMap": osm
    };

    const overlayMaps = {
      "Markfuktighet (SLU)": soilMoisture
    };

    L.control.layers(baseMaps, overlayMaps).addTo(map);

    // Slå på lagret direkt (valfritt)
    soilMoisture.addTo(map);

  </script>

</body>
</html>
