<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supersplat Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .viewer-wrapper {
      max-width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    iframe {
      border: none;
      width: 800px;
      height: 500px;
      max-width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="viewer-wrapper">
    <iframe
      id="viewer"
      allow="fullscreen; xr-spatial-tracking"
      src="https://superspl.at/s?id=ae5c632b">
    </iframe>
  </div>
</body>
</html>
